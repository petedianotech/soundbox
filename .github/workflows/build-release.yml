name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > my-upload-key.jks
            echo "Decoded custom release keystore into my-upload-key.jks"
            keytool -list -v -keystore my-upload-key.jks \
              -storepass "${{ secrets.KEYSTORE_PASSWORD }}" \
              -alias "${{ secrets.KEY_ALIAS }}" 2>/dev/null \
              | grep -E 'SHA256:|SHA1:|Alias name:|Valid from:' || true
          else
            echo "::warning::KEYSTORE_BASE64 secret is empty. Release will fall back to debug signing."
          fi
          if [ ! -f my-upload-key.jks ] && [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore for CI builds"
          fi

      - name: Build Release APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: my-upload-key.jks
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle :app:assembleRelease --no-daemon -Djava.awt.headless=true

      - name: Prepare single Soundbox APK
        run: |
          mkdir -p dist
          # Prefer the universal / main release APK (no ABI suffix)
          SRC=""
          if [ -f app/build/outputs/apk/release/app-release.apk ]; then
            SRC="app/build/outputs/apk/release/app-release.apk"
          else
            # Fallback: take the largest APK (universal is usually biggest)
            SRC=$(ls -S app/build/outputs/apk/release/*.apk 2>/dev/null | head -1)
          fi
          if [ -z "$SRC" ] || [ ! -f "$SRC" ]; then
            echo "ERROR: No release APK found"
            ls -la app/build/outputs/apk/release/ || true
            exit 1
          fi
          OUT="Soundbox-release-b${{ github.run_number }}.apk"
          cp -f "$SRC" "dist/$OUT"
          echo "Selected single APK: $SRC -> dist/$OUT"
          ls -lh dist/
          # Verify only one file
          COUNT=$(ls dist/*.apk 2>/dev/null | wc -l)
          echo "APK count in dist: $COUNT"
          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: Expected exactly 1 APK"
            exit 1
          fi

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soundbox-Release-APK
          path: dist/*.apk
          retention-days: 14
          if-no-files-found: error
