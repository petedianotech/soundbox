name: Build APK

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.3.1'

      - name: Prepare Signing Keystore
        env:
          ENCODED_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$ENCODED_KEYSTORE" ]; then
            echo "$ENCODED_KEYSTORE" | base64 --decode > my-upload-key.jks
            echo "Decoded custom release keystore into my-upload-key.jks"
          fi
          if [ ! -f my-upload-key.jks ] && [ ! -f debug.keystore ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
            echo "Generated fallback debug.keystore for CI builds"
          fi

      - name: Build Release and Debug APKs
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          STORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEYSTORE_PATH: my-upload-key.jks
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
        run: gradle assembleRelease assembleDebug --no-daemon

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soundbox-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 14

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Soundbox-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
